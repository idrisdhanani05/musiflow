<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Flow | Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div class="background-blur"></div>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">

                <i class="fa-brands fa-spotify"></i>

                <h1>Music Flow</h1>

                <p style="text-align:center; color:#aaa; font-size:13px; margin-top:15px;">
    This is a UI/UX educational project. No data is collected.
</p>

            </div>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Sign in to continue listening to your favourite music.
            </p>

            <form id="loginForm">

                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">

                    Login

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="social-login">

                <button>

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>

                <button>

                    <i class="fa-brands fa-apple"></i>

                    Continue with Apple

                </button>

        

            </div>

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">Sign Up</a>

            </p>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
