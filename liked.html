<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liked Songs - MusicFlow</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/liked.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <main class="liked-page">

        <header class="liked-header">

            <div class="liked-icon">
                <i class="fa-solid fa-heart"></i>
            </div>

            <div>
                <p>PLAYLIST</p>
                <h1>Liked Songs</h1>
                <span>Your favorite tracks</span>
            </div>

        </header>


        <section class="liked-section">

            <div class="liked-list">

                <div class="liked-song">

                    <span class="song-number">1</span>

                    <div class="song-icon">
                        🎵
                    </div>

                    <div class="song-details">

                        <h3>Kesariya</h3>
                        <p>Arijit Singh</p>

                    </div>

                    <button class="like-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                </div>


                <div class="liked-song">

                    <span class="song-number">2</span>

                    <div class="song-icon">
                        🎵
                    </div>

                    <div class="song-details">

                        <h3>Perfect</h3>
                        <p>Ed Sheeran</p>

                    </div>

                    <button class="like-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                </div>


                <div class="liked-song">

                    <span class="song-number">3</span>

                    <div class="song-icon">
                        🎵
                    </div>

                    <div class="song-details">

                        <h3>Blinding Lights</h3>
                        <p>The Weeknd</p>

                    </div>

                    <button class="like-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                </div>


                <div class="liked-song">

                    <span class="song-number">4</span>

                    <div class="song-icon">
                        🎵
                    </div>

                    <div class="song-details">

                        <h3>Chaleya</h3>
                        <p>Arijit Singh</p>

                    </div>

                    <button class="like-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                </div>


                <div class="liked-song">

                    <span class="song-number">5</span>

                    <div class="song-icon">
                        🎵
                    </div>

                    <div class="song-details">

                        <h3>Shape of You</h3>
                        <p>Ed Sheeran</p>

                    </div>

                    <button class="like-btn">
                        <i class="fa-solid fa-heart"></i>
                    </button>

                </div>

            </div>

        </section>

    </main>
<script src="js/liked.js"></script>
</body>

</html>
