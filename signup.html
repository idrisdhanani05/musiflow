<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Flow | Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div class="background-blur"></div>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">

                <i class="fa-brands fa-spotify"></i>

                <h1>Music Flow</h1>

                <p style="text-align:center; color:#aaa; font-size:13px; margin-top:15px;">
                    This is a UI/UX educational project. No data is collected.
                </p>

            </div>


            <h2>Create Account</h2>

            <p class="subtitle">
                Sign up to start listening to your favourite music.
            </p>


            <form id="signupForm">

                <div class="input-box">

                    <label>Name</label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="input-box">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>


                <button type="submit" class="login-btn">
                    Sign Up
                </button>

            </form>


            <div class="divider">

                <span>OR</span>

            </div>


            <div class="social-login">

                <button type="button">

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>


                <button type="button">

                    <i class="fa-brands fa-apple"></i>

                    Continue with Apple

                </button>

            </div>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <script src="js/signup.js"></script>

</body>

</html>
